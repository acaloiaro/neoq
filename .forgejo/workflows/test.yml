name: test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    container: golang:1.24.0
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_PASSWORD: postgres
      redis:
        image: redis

    steps:
      - name: checkout
        run: |
          git clone "${{ github.server_url }}/${{ github.repository }}.git" .
          # PRs from forks only exist under refs/pull/*/head, which clones don't fetch
          git fetch origin "${{ github.ref }}"
          git checkout "${{ github.sha }}"
      - name: wait for services
        run: |
          for port in 5432 6379; do
            echo "waiting for 127.0.0.1:${port} ..."
            for _ in $(seq 1 60); do
              if (exec 3<>/dev/tcp/127.0.0.1/${port}) 2>/dev/null; then
                exec 3>&-
                echo "127.0.0.1:${port} is up"
                break
              fi
              sleep 1
            done
          done
      - name: test
        run: make mod test coverage
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable&pool_max_conns=8
          TEST_REDIS_URL: 127.0.0.1:6379
      - name: function coverage
        run: make func-coverage
